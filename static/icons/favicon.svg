<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#1e293b"/>
  <!-- Market stall awning -->
  <path d="M6 10 L16 7 L26 10 L26 13 L6 13 Z" fill="#ef4444"/>
  <path d="M6 10 L10 10 L10 13 L6 13Z" fill="#fbbf24"/>
  <path d="M10 10 L14 10 L14 13 L10 13Z" fill="#ef4444"/>
  <path d="M14 10 L18 10 L18 13 L14 13Z" fill="#fbbf24"/>
  <path d="M18 10 L22 10 L22 13 L18 13Z" fill="#ef4444"/>
  <path d="M22 10 L26 10 L26 13 L22 13Z" fill="#fbbf24"/>
  <!-- Stall counter -->
  <rect x="7" y="13" width="18" height="8" rx="1" fill="#334155"/>
  <rect x="7" y="13" width="18" height="2" rx="1" fill="#475569"/>
  <!-- Mini figure on counter (tiny soldier silhouette) -->
  <circle cx="16" cy="15.5" r="1.2" fill="#fbbf24"/>
  <rect x="15.1" y="16.7" width="1.8" height="2.5" rx="0.4" fill="#fbbf24"/>
  <line x1="15.1" y1="17.5" x2="13.8" y2="18.8" stroke="#fbbf24" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="16.9" y1="17.5" x2="18.2" y2="18.8" stroke="#fbbf24" stroke-width="0.7" stroke-linecap="round"/>
  <!-- Price tag -->
  <rect x="10" y="15.5" width="4" height="2.5" rx="0.5" fill="#fbbf24"/>
  <text x="12" y="17.4" font-family="sans-serif" font-size="1.8" font-weight="bold" text-anchor="middle" fill="#1e293b">£</text>
  <!-- Legs of stall -->
  <line x1="8" y1="21" x2="8" y2="25" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="21" x2="24" y2="25" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
</svg>
