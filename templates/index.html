<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mini Scrape</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .sticker {
      transform: rotate(-6deg);
      background: radial-gradient(circle at 30% 25%, #fffbeb 0%, #fef3c7 70%, #fcd34d 100%);
      clip-path: polygon(
        50% 0%, 60% 12%, 73% 7%, 76% 21%, 90% 22%, 86% 36%, 99% 43%,
        90% 54%, 100% 65%, 86% 71%, 88% 84%, 74% 84%, 71% 97%, 59% 89%,
        50% 100%, 41% 89%, 29% 97%, 26% 84%, 12% 84%, 14% 71%, 0% 65%,
        10% 54%, 1% 43%, 14% 36%, 10% 22%, 24% 21%, 27% 7%, 40% 12%
      );
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="sticky top-0 z-10 bg-gray-50/90 backdrop-blur border-b">
    <div class="max-w-7xl mx-auto p-4">
      <form id="f" class="flex gap-2 max-w-md mx-auto">
        <input id="q" name="q" type="text" autofocus
               placeholder="Search miniatures…"
               class="flex-1 border rounded px-3 py-1.5 text-sm" />
        <button class="bg-black text-white px-3 py-1.5 rounded text-sm">Search</button>
      </form>
    </div>
  </header>

  <aside id="sidebar"
         class="fixed top-20 left-0 z-20 bg-white border border-l-0 rounded-r-lg shadow-md transition-transform -translate-x-[calc(100%-2.25rem)]">
    <button id="sidebar-toggle" type="button"
            class="absolute top-2 right-2 text-gray-500 hover:text-black text-lg leading-none">›</button>
    <div class="p-4 pr-10 w-72">
      <h2 class="font-semibold text-sm mb-2">Free UK shipping thresholds</h2>
      <ul class="text-sm space-y-1">
        <li class="flex items-center gap-2"><img src="/static/icons/wayland.png" class="w-4 h-4 object-contain" alt="" /> <span class="flex-1">Wayland Games</span> <span class="font-medium">£20</span></li>
        <li class="flex items-center gap-2"><img src="/static/icons/firestorm.png" class="w-4 h-4 object-contain" alt="" /> <span class="flex-1">Firestorm Games</span> <span class="font-medium">£60</span></li>
        <li class="flex items-center gap-2"><img src="/static/icons/goblin.webp" class="w-4 h-4 object-contain" alt="" /> <span class="flex-1">Goblin Gaming</span> <span class="font-medium">£75</span></li>
        <li class="flex items-center gap-2"><img src="/static/icons/element.ico" class="w-4 h-4 object-contain" alt="" /> <span class="flex-1">Element Games</span> <span class="font-medium">£80</span></li>
      </ul>
      <p class="text-xs text-gray-500 mt-3">UK standard delivery, excluding restricted items. Always check the store for the current rate.</p>
    </div>
  </aside>

  <main class="max-w-7xl mx-auto p-6">

    <div id="errors" class="text-sm text-red-700 mb-2"></div>

    <div id="grid" class="flex flex-wrap justify-center gap-4"></div>
  </main>

  <script>
    const f = document.getElementById('f');
    const qEl = document.getElementById('q');
    const grid = document.getElementById('grid');
    const errors = document.getElementById('errors');

    const fmt = (n) => (typeof n === 'number') ? '£' + n.toFixed(2) : '';
    const esc = (s) => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    function offerRow(o) {
      // o has retailer name + icon + slug always; price/url/in_stock may be missing.
      const inner = `
        <span class="flex items-center gap-2 min-w-0">
          <img src="${esc(o.retailer_icon)}" class="w-4 h-4 object-contain shrink-0" alt="" />
          <span class="truncate">${esc(o.retailer)}</span>
        </span>`;
      if (!o.found) {
        return `<div class="flex items-center justify-between gap-2 py-1 px-2 text-sm text-gray-400">
          ${inner}<span class="italic">Not found</span></div>`;
      }
      if (!o.in_stock) {
        return `<a href="${esc(o.url)}" target="_blank" rel="noopener"
          class="flex items-center justify-between gap-2 py-1 px-2 hover:bg-gray-50 rounded text-sm text-gray-500">
          ${inner}<span class="italic">No stock</span></a>`;
      }
      return `<a href="${esc(o.url)}" target="_blank" rel="noopener"
        class="flex items-center justify-between gap-2 py-1 px-2 hover:bg-gray-50 rounded text-sm">
        ${inner}<span class="font-medium">${fmt(o.price)}</span></a>`;
    }

    function buildOffers(group, allRetailers) {
      const bySlug = new Map((group.offers || []).map(o => [o.retailer_slug, o]));
      return allRetailers.map(r => {
        const found = bySlug.get(r.slug);
        if (found) return { ...found, found: true };
        return {
          retailer: r.name,
          retailer_slug: r.slug,
          retailer_icon: r.icon,
          found: false,
        };
      });
    }

    function card(g, allRetailers) {
      const offers = buildOffers(g, allRetailers).map(offerRow).join('');
      const hasStock = g.any_in_stock;
      const stickerInner = hasStock
        ? `<div class="font-extrabold text-sm leading-none">${fmt(g.cheapest_price)}</div>`
        : `<div class="font-bold text-xs leading-tight text-center">No stock</div>`;

      const imgInner = g.image_url
        ? `<img src="${esc(g.image_url)}" class="w-full h-full object-contain" alt="${esc(g.title)}" />`
        : `<div class="w-full h-full flex items-center justify-center text-gray-400 bg-gray-100">no image</div>`;

      const imgWrap = hasStock
        ? `<a href="${esc(g.cheapest_url)}" target="_blank" rel="noopener" class="block w-full h-full">${imgInner}</a>`
        : imgInner;

      return `
        <div class="bg-white border rounded-lg overflow-hidden flex flex-col w-72">
          <div class="relative" style="height:240px">
            ${imgWrap}
            <div class="sticker absolute bottom-8 right-3 w-16 h-16 flex flex-col items-center justify-center text-stone-900"
                 title="${esc(g.cheapest_retailer || '')}">
              ${stickerInner}
            </div>
          </div>
          <div class="p-3 flex flex-col gap-2 flex-1">
            <div class="font-medium text-sm leading-snug line-clamp-2" title="${esc(g.title)}">${esc(g.title)}</div>
            <div class="flex flex-col gap-0.5 mt-auto">${offers}</div>
          </div>
        </div>`;
    }

    async function runSearch(q) {
      grid.innerHTML = '';
      errors.textContent = '';
      try {
        const r = await fetch('/search?q=' + encodeURIComponent(q));
        const data = await r.json();
        const groups = data.groups || [];
        const retailers = data.retailers || [];
        grid.innerHTML = groups.map(g => card(g, retailers)).join('');
        const errEntries = Object.entries(data.errors || {});
        if (errEntries.length) {
          errors.innerHTML = '<strong>Errors:</strong> ' + errEntries.map(([k,v]) => `${esc(k)}: ${esc(v)}`).join(' · ');
        }
      } catch (err) {
        errors.textContent = 'Request failed: ' + err;
      }
    }

    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = qEl.value.trim();
      if (!q) return;
      const url = '/?q=' + encodeURIComponent(q);
      if (location.pathname + location.search !== url) {
        history.pushState({q}, '', url);
      }
      runSearch(q);
    });

    window.addEventListener('popstate', () => {
      const q = new URLSearchParams(location.search).get('q') || '';
      qEl.value = q;
      if (q) runSearch(q); else { grid.innerHTML = ''; }
    });

    // Sidebar toggle
    {
      const sb = document.getElementById('sidebar');
      const btn = document.getElementById('sidebar-toggle');
      btn.addEventListener('click', () => {
        const open = sb.classList.toggle('translate-x-0');
        sb.classList.toggle('-translate-x-[calc(100%-2.25rem)]', !open);
        btn.textContent = open ? '‹' : '›';
      });
    }

    // Initial load: if URL has ?q=, populate input and run search.
    {
      const q = new URLSearchParams(location.search).get('q') || '';
      if (q) {
        qEl.value = q;
        runSearch(q);
      }
    }
  </script>
</body>
</html>
